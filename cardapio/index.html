<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244a36"><title>Cardápio | Zuqui Garden Coffee</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="./styles.css"></head><body>
<header><a href="/" class="brand"><img src="../assets/logo-transparente.png" alt="Zuqui Garden Coffee"></a><button id="cartButton" class="cart-button">Pedido <span id="cartCount">0</span></button></header>
<main><section class="hero"><p>PADARIA • CAFETERIA • MERCADO</p><h1>Seu pedido, do seu jeito.</h1><span>Escolha os produtos, informe sua comanda e confira tudo antes de enviar.</span></section><nav id="categories" class="categories"></nav><div id="notice" class="notice"></div><section id="products" class="products"></section></main>
<aside id="cart" class="cart" aria-hidden="true"><div class="cart-head"><div><small>RESUMO</small><h2>Seu pedido</h2></div><button id="closeCart" aria-label="Fechar">×</button></div><div id="cartItems"></div><p id="cardClaimStatus" class="notice">Para finalizar, leia o QR da comanda no PDV.</p><label>Ponto de referência<select id="referenceSelect"><option value="">Selecione</option></select></label><label>Observação<textarea id="orderNote" maxlength="300" placeholder="Opcional"></textarea></label><div class="total"><span>Total</span><strong id="cartTotal">R$ 0,00</strong></div><button id="reviewButton" class="primary">Revisar pedido</button><p id="cartMessage" class="message"></p></aside><div id="overlay" class="overlay"></div>
<dialog id="reviewDialog"><h2>Confirme seu pedido</h2><div id="reviewContent"></div><div class="dialog-actions"><button id="backButton">Voltar</button><button id="confirmButton" class="primary">Confirmar pedido</button></div><p id="reviewMessage" class="message"></p></dialog>
<script src="../cardapio-config.js?v=20260930-2"></script><script type="module" src="./app.js?v=20260930-2"></script></body></html>
