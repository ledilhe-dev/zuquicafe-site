<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração do Cardápio | Zuqui</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="./styles.css"><style>.filters{margin:16px 0}.filters input[type=checkbox],.select-product input{width:auto}.bulk-actions{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;margin:12px 0;background:#fffdf8;border:1px solid #dfe6df;border-radius:12px}.groups{display:flex;gap:8px;overflow:auto;margin:14px 0 20px}.groups button{white-space:nowrap;background:#5c715f}.item.enabled{border-left:5px solid #2d8a50}.item.disabled{border-left:5px solid #ae534c;opacity:.88}.item:has(.select-product){grid-template-columns:auto 1fr auto}.select-product{display:flex;align-items:flex-start;gap:7px;font-weight:700}@media(max-width:650px){.item:has(.select-product){grid-template-columns:1fr}.bulk-actions button{flex:1 1 45%}}</style></head><body><main>
<section id="loginView" class="login card"><img src="../assets/logo-transparente.png" alt="Zuqui"><h1>Cardápio administrativo</h1><form id="loginForm"><label>Usuário<input id="username" value="Admin" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="loginMsg"></p></section>
<section id="changeView" class="login card" hidden><h1>Troque a senha inicial</h1><p>Para continuar, defina uma nova senha exclusiva.</p><form id="changeForm"><label>Nova senha<input id="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirmar<input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></label><button>Alterar senha</button></form><p id="changeMsg"></p></section>
<section id="appView" hidden><header><div><small>ZUQUI GARDEN COFFEE</small><h1>Cardápio digital</h1></div><button id="logout" class="ghost">Sair</button></header><nav id="tabs"><button data-tab="products" class="active">Produtos</button><button data-tab="sync">Sincronização</button><button data-tab="cards">Comandas</button><button data-tab="references">Referências</button><button data-tab="orders">Pedidos</button><button data-tab="integration">Integração</button></nav><div id="content"></div></section>
</main><dialog id="qrDialog"><h2 id="qrTitle"></h2><img id="qrImage" alt="QR Code"><p id="qrValue" class="order-meta"></p><button onclick="this.closest('dialog').close()">Fechar</button></dialog><script src="../cardapio-config.js?v=20260930-2"></script><script type="module" src="./app.js?v=20260930-2"></script></body></html>
